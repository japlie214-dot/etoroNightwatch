# Signs and sends one demo-control envelope to the phone. No public URL: only the main
# Worker's DEMO_CONTROL_DISPATCH service binding can reach it.
name = "etoro-nightwatch-demo-dispatch"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "etoronightwatch"

# Same KV namespace as the main Worker: it holds the phone's FCM token.
[[kv_namespaces]]
binding = "NIGHTWATCH_SNAPSHOTS"
id = "2d25f0102d524891990b28e26851f48a"

# Secrets (wrangler secret put): FIREBASE_SERVICE_ACCOUNT_JSON, COMMAND_HMAC_SECRET
